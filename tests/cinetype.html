<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0d0e12" />
<title>CineType v2 — Movie Personality</title>
<style>
:root{
  --bg:#0d0e12;--bg2:#12141a;--panel:#171a21;--panel2:#1d212a;--text:#f5f2ea;--muted:#a7a8ad;--faint:#70747d;
  --line:rgba(255,255,255,.11);--shadow:0 24px 70px rgba(0,0,0,.34);--radius:22px;
  --taste-a:#d8ff62;--taste-b:#ff8fb6;--watch-a:#66d8ff;--watch-b:#ffb15f;--danger:#ff786f;
  --soft:rgba(255,255,255,.055);--soft2:rgba(255,255,255,.035);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
}
html[data-theme="light"]{
  --bg:#f5f2eb;--bg2:#ebe8e1;--panel:#fffdfa;--panel2:#f5f1e9;--text:#1b1c21;--muted:#60636c;--faint:#8d9097;
  --line:rgba(20,22,28,.12);--shadow:0 20px 55px rgba(61,55,45,.14);--soft:rgba(20,22,28,.055);--soft2:rgba(20,22,28,.035);
}
*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;color:var(--text);background:
 radial-gradient(circle at 8% -5%,color-mix(in srgb,var(--taste-b) 13%,transparent),transparent 30%),
 radial-gradient(circle at 92% 4%,color-mix(in srgb,var(--watch-a) 12%,transparent),transparent 27%),var(--bg);transition:background .25s,color .25s}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:40;min-height:66px;display:flex;align-items:center;gap:20px;padding:10px max(20px,calc((100vw - 1180px)/2));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.brand{border:0;background:none;color:var(--text);font-weight:900;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:9px;white-space:nowrap}.brand-mark{color:var(--taste-a)}
.topnav{display:flex;align-items:center;gap:4px;flex:1;overflow:auto;scrollbar-width:none}.topnav::-webkit-scrollbar{display:none}.topnav button,.utility button{border:0;background:none;color:var(--muted);padding:9px 11px;border-radius:11px;white-space:nowrap}.topnav button:hover,.utility button:hover{background:var(--soft);color:var(--text)}
.utility{display:flex;gap:6px}.utility button{border:1px solid var(--line);background:var(--soft2)}
main{max-width:1180px;margin:auto;padding:0 20px 70px}.page{animation:rise .28s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{padding:82px 0 48px;max-width:1000px}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:900;color:var(--muted);margin-bottom:14px}.hero h1,.page-head h1{font-size:clamp(44px,7vw,84px);line-height:.96;letter-spacing:-.065em;margin:0}.hero h1 em{font-style:normal;color:var(--taste-a)}.lede{max-width:780px;font-size:20px;line-height:1.55;color:var(--muted);margin:25px 0 30px}
.actions,.button-row{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary,.ghost,.option-btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800}.primary{background:var(--taste-a);color:#10120b}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.primary:hover,.secondary:hover,.ghost:hover,.option-btn:hover{transform:translateY(-1px)}.small{padding:8px 11px;font-size:13px}.full{width:100%}
.mode-grid,.module-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:18px 0 38px}.card,.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:27px}.card h2,.panel h2,.panel h3{margin:0 0 10px;letter-spacing:-.025em}.card p,.panel p{color:var(--muted);line-height:1.55}.taste-card{border-top:4px solid var(--taste-a)}.watch-card{border-top:4px solid var(--watch-a)}
.module-pill{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:900;padding:7px 10px;border-radius:999px;background:var(--soft)}.dot{width:8px;height:8px;border-radius:50%}.taste-dot{background:var(--taste-a)}.watch-dot{background:var(--watch-a)}
.principles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.principle{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--soft2)}.principle b{display:block;margin-bottom:6px}.principle span{font-size:13px;color:var(--muted);line-height:1.45}
.page-head{padding:55px 0 25px}.page-head h1{font-size:clamp(38px,5vw,64px)}.page-head p{color:var(--muted);max-width:750px;line-height:1.55;font-size:17px}
.quiz-shell{max-width:840px;margin:32px auto 0}.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:17px}.progress-track{height:7px;background:var(--soft);border-radius:999px;overflow:hidden;flex:1}.progress-fill{height:100%;border-radius:999px;transition:width .22s}.taste-progress{background:linear-gradient(90deg,var(--taste-a),var(--taste-b))}.watch-progress{background:linear-gradient(90deg,var(--watch-a),var(--watch-b))}.count{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.question-card{padding:clamp(22px,4vw,38px);background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}.question-kind{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.12em;text-transform:uppercase}.question-card h2{font-size:clamp(25px,4vw,38px);line-height:1.15;letter-spacing:-.04em;margin:12px 0 8px}.question-sub{color:var(--muted);margin:0 0 22px;line-height:1.45;font-size:14px}.options{display:grid;gap:10px}.option-btn{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:680;line-height:1.35;padding:15px 16px;min-height:54px}.option-btn:hover{border-color:color-mix(in srgb,var(--module-color) 55%,var(--line));background:color-mix(in srgb,var(--module-color) 7%,var(--panel2))}.option-label{display:flex;gap:11px;align-items:flex-start}.option-key{font-size:11px;font-weight:900;color:var(--muted);border:1px solid var(--line);min-width:23px;height:23px;border-radius:7px;display:grid;place-items:center}.quiz-bottom{display:flex;justify-content:space-between;margin-top:13px}.micro{font-size:12px;color:var(--muted);line-height:1.45}.link-btn{background:none;border:0;color:var(--muted);padding:9px 3px}.link-btn:hover{color:var(--text)}
.result-wrap{padding:52px 0 30px}.result-hero{position:relative;overflow:hidden;padding:38px;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:var(--shadow)}.result-hero:after{content:"";position:absolute;inset:-30% -10% auto 48%;height:440px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--result-color) 22%,transparent),transparent 66%);pointer-events:none}.result-code{font-size:clamp(76px,13vw,155px);font-weight:950;letter-spacing:-.09em;line-height:.82;color:var(--result-color);position:relative;z-index:1}.result-title{font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:-.05em;margin:18px 0 8px;position:relative;z-index:1}.result-headline{max-width:820px;color:var(--muted);font-size:18px;line-height:1.5;position:relative;z-index:1}
.result-section{margin-top:18px;padding:27px;background:var(--panel);border:1px solid var(--line);border-radius:22px}.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}.section-title-row h2{margin:0;letter-spacing:-.035em}.palette-tag{font-size:12px;font-weight:900;padding:7px 10px;border-radius:999px;background:var(--soft)}
.axis-list{display:grid;gap:13px}.axis-card{padding:17px;border:1px solid var(--line);border-radius:17px;background:var(--soft2)}.axis-head{display:flex;justify-content:space-between;gap:20px;font-size:13px;font-weight:850}.axis-head span:last-child{color:var(--module-color)}.bipolar{position:relative;margin:12px 0 10px;height:12px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--module-secondary) 48%,transparent),var(--soft),color-mix(in srgb,var(--module-color) 48%,transparent))}.bipolar:after{content:"";position:absolute;left:50%;top:-4px;width:1px;height:20px;background:var(--line)}.axis-dot{position:absolute;top:50%;width:19px;height:19px;border-radius:50%;transform:translate(-50%,-50%);background:var(--module-color);border:4px solid var(--panel);box-shadow:0 0 0 1px var(--line)}.axis-statement{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.map-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.map-card{padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--soft2)}.map-card h3{margin:2px 0 8px;font-size:15px}.map-card canvas{display:block;width:100%;height:auto;border-radius:12px}
.reco-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.reco-list{display:grid;gap:9px}.reco{padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--soft2);display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.reco b{display:block}.reco small{display:block;color:var(--muted);line-height:1.4;margin-top:4px}.match{font-size:11px;font-weight:900;color:var(--module-color);white-space:nowrap}
.egg-list{display:flex;flex-wrap:wrap;gap:8px}.egg{padding:10px 12px;border-radius:13px;background:var(--soft);font-size:13px;border:1px solid var(--line)}
.grill-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:16px}.panel{padding:24px}.source-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.source-tabs button{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted)}.source-tabs button.active{color:var(--text);background:var(--soft)}.connector{padding:16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);line-height:1.5}.connector input,.connector textarea{width:100%;margin-top:11px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text)}.connector textarea{min-height:130px;resize:vertical}.filebox{display:block;margin:14px 0;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--muted)}.filebox input{display:none}.import-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{padding:13px;border-radius:13px;background:var(--soft2);border:1px solid var(--line)}.stat b{display:block;font-size:22px}.grill-copy{line-height:1.65;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:90;padding:11px 15px;border-radius:12px;background:var(--text);color:var(--bg);font-size:13px;font-weight:800;box-shadow:var(--shadow)}
.footer-note{margin-top:35px;color:var(--faint);font-size:12px;line-height:1.5}.kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;font-size:11px;color:var(--muted)}
@media(max-width:820px){.topbar{gap:8px}.brand span:last-child{display:none}.module-grid,.mode-grid,.reco-grid,.grill-grid,.map-grid{grid-template-columns:1fr}.principles{grid-template-columns:1fr 1fr}.utility button span{display:none}.result-hero{padding:27px}.result-section{padding:20px}.import-summary{grid-template-columns:1fr 1fr}}
@media(max-width:520px){main{padding-left:14px;padding-right:14px}.hero{padding-top:55px}.hero h1{font-size:47px}.principles{grid-template-columns:1fr}.question-card{padding:21px}.topnav button{padding:8px 7px;font-size:12px}.utility{gap:3px}.utility button{padding:8px}.result-code{font-size:82px}.axis-head{font-size:12px}.reco{display:block}.match{display:block;margin-top:8px}.actions>*{width:100%}}
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" data-nav="home"><span class="brand-mark">◉</span><span>CineType</span></button>
  <nav class="topnav" id="topnav"></nav>
  <div class="utility">
    <button id="langBtn" title="Language">中 / EN</button>
    <button id="themeBtn" title="Theme"><span id="themeIcon">☾</span> <span id="themeLabel">Dark</span></button>
  </div>
</header>
<main id="app"></main>
<div id="toast" class="toast hidden"></div>
<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const STORAGE='cinetype-v2-state';
const initial={lang:(navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en',theme:'dark',taste:null,watch:null,imported:null,last:'home'};
let state=load(), session=null, flow=null;
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(STORAGE)||'{}')}}catch{return {...initial}}}
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function L(x){if(x==null)return '';return typeof x==='string'?x:(x[state.lang]??x.en??'')}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){const el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),1800)}
function pct(v){return Math.round(Math.abs(v))}
function hashHue(code,kind){let h=kind==='taste'?72:198;for(let i=0;i<code.length;i++)h=(h+code.charCodeAt(i)*29)%360;return h}
function resultColor(r){return `hsl(${hashHue(r.code,r.kind)} 86% ${state.theme==='dark'?67:42}%)`}
function applyTheme(){document.documentElement.dataset.theme=state.theme;$('#themeIcon').textContent=state.theme==='dark'?'☾':'☀';$('#themeLabel').textContent=state.lang==='zh'?(state.theme==='dark'?'深色':'浅色'):(state.theme==='dark'?'Dark':'Light');document.querySelector('meta[name="theme-color"]').content=state.theme==='dark'?'#0d0e12':'#f5f2eb'}
const UI={
 nav:{home:{en:'Home',zh:'首页'},taste:{en:'Film DNA',zh:'电影偏好'},watch:{en:'Watching Style',zh:'观影方式'},grill:{en:'Grill Lab',zh:'影评拷问'},results:{en:'Results',zh:'结果'}},
 home:{
  eye:{en:'Two small quizzes. One annoyingly specific movie profile.',zh:'两份小测试，一张有点过分具体的电影人格画像。'},
  title1:{en:'What do movies need to do',zh:'电影要怎么拍，'},title2:{en:'to win you over?',zh:'才能让你买账？'},
  lede:{en:'CineType separates what you reward on screen from how you behave around movies. The questions are short, sideways, and designed to be harder to reverse-engineer than a normal personality quiz.',zh:'CineType 把“你喜欢电影怎么拍”和“你平时怎么看电影”分开测。题目尽量短、绕一点弯，不会直接问你“你是不是喜欢复杂人物”这种一眼看穿答案的题。'},
  quick:{en:'Quick Double Feature · 22 Q',zh:'快速双片连映 · 22 题'},deep:{en:"Director's Cut · 44 Q",zh:'导演剪辑版 · 44 题'},
  tTitle:{en:'Film DNA',zh:'电影偏好'},tSub:{en:'What do you reward?',zh:'什么样的电影更容易让你买账？'},tCopy:{en:'People or roles. Organic consequences or designed payoffs. Quiet feeling or overt cueing. Invisible craft or a loud authorial fingerprint.',zh:'人物要不要像真实的人？剧情要自然生长还是精密编排？情绪要埋进去还是直接推给你？电影语言要隐身还是高调现身？'},
  wTitle:{en:'Watching Style',zh:'观影方式'},wSub:{en:'What kind of viewer are you?',zh:'你是哪一种观众？'},wCopy:{en:'Do you surrender or audit? Stream anywhere or turn screenings into events? Log everything or let it fade? Sample freely or fall into completionist rabbit holes?',zh:'看片时先沉浸还是边看边审？在哪儿都能看还是一定要讲究场合？看完就算还是留下记录？随缘抽样还是一不小心补完整个系列？'},
  qQuick:{en:'Quick Cut',zh:'快速版'},qDeep:{en:'Deep Cut',zh:'深入版'},
  pTitle:{en:'Built to surprise you, not flatter you.',zh:'不是来夸你的，也尽量不让你一眼猜到测什么。'},
  p1a:{en:'Short by default',zh:'默认够短'},p1b:{en:'Most questions are one sentence and one decision.',zh:'大多数题只有一句情境和一个选择。'},
  p2a:{en:'Continuous underneath',zh:'底层保留连续分数'},p2b:{en:'The four letters are a nickname, not a diagnosis.',zh:'四个字母是方便传播的昵称，不是假装科学的诊断。'},
  p3a:{en:'Movie duels are weak evidence',zh:'电影二选一只算弱证据'},p3b:{en:"Knowing or loving one movie shouldn't hijack your whole type.",zh:'看过某部片、喜欢某个演员，不该把整份结果带跑。'},
  p4a:{en:'No “good” pole',zh:'没有“正确答案”那一端'},p4b:{en:'Myth, melodrama and big obvious craft are legitimate tastes too.',zh:'喜欢神话式人物、浓烈煽情、显眼的形式感，也完全可以是一种稳定口味。'}
 },
 quiz:{back:{en:'Back',zh:'上一题'},skip:{en:'Skip',zh:'跳过'},duel:{en:'Movie duel · weak evidence',zh:'电影二选一 · 只算弱证据'},scene:{en:'Quick scene',zh:'小情境'},habit:{en:'Viewer habit',zh:'观影习惯'},unknown:{en:"Haven't seen both / can't choose",zh:'没都看过 / 选不出来'}},
 results:{
  taste:{en:'FILM DNA',zh:'电影偏好'},watch:{en:'WATCHING STYLE',zh:'观影方式'},
  party:{en:'The letters are the party hat. The scores underneath are the actual profile.',zh:'四个字母负责好玩和好记，下面的连续分数才是实际画像。'},
  axes:{en:'Your four axes',zh:'你的四条轴'},maps:{en:'Two maps, no radar chart gymnastics',zh:'两张坐标图，不再折腾雷达图'},
  movies:{en:'Movie suggestions',zh:'电影建议'},directors:{en:'Director neighborhoods',zh:'导演邻域'},
  grammar:{en:'grammar match',zh:'语法匹配'},eggs:{en:'Out-of-dimension incidents',zh:'掉出维度的异常事件'},
  share:{en:'Make share card',zh:'生成分享卡'},retake:{en:'Retake this quiz',zh:'重测这一份'},grill:{en:'Grill this with my diary',zh:'拿观影记录来拷问结果'},other:{en:'Take the other quiz',zh:'再测另一份'},
  noTaste:{en:'Take Film DNA to unlock movie and director suggestions.',zh:'完成“电影偏好”后会解锁电影和导演建议。'}
 },
 grill:{
  eye:{en:'GRILL LAB · LOCAL DEMO',zh:'影评拷问 · 本地演示'},title:{en:'Give the quiz evidence it can argue with.',zh:'把观影记录交上来，让测试有机会反驳你。'},copy:{en:'CSV/text import works locally. Live account connectors remain placeholders in this prototype.',zh:'CSV / 文本导入会在本机运行；账号直连在这个原型里仍然只是占位功能。'},
  source:{en:'Pick a source',zh:'选择来源'},local:{en:'Nothing leaves this browser.',zh:'数据不会离开这个浏览器。'},
  demo:{en:'Load anonymous demo diary',zh:'载入匿名演示观影记录'},analyze:{en:'Analyze import',zh:'分析导入内容'},grillBtn:{en:'Grill me',zh:'开始拷问'},waiting:{en:'Waiting for evidence.',zh:'等待证据。'},
  upload:{en:'Choose a CSV or text file',zh:'选择 CSV 或文本文件'},uploadSub:{en:'Letterboxd/IMDb-ish CSV and generic Title + Rating columns are supported.',zh:'支持 Letterboxd / IMDb 风格 CSV，也支持含“片名 + 评分”字段的普通表格。'}
 }
};

const tasteAxes={
 char:{neg:{en:'Role-led',zh:'角色型'},pos:{en:'Agentic',zh:'主体型'},negL:'R',posL:'A',label:{en:'Character logic',zh:'人物逻辑'},
  posStmt:{en:'You {d} need characters to feel like autonomous people whose choices belong specifically to them, rather than mainly serving as clean roles or symbols.',zh:'你{d}希望人物像有自己意志的人，行为首先属于这个具体人物，而不是主要承担清晰的类型功能或象征作用。'},
  negStmt:{en:'You {d} enjoy characters working as clear roles, archetypes or symbols, without requiring every one of them to behave like a fully autonomous psychological portrait.',zh:'你{d}接受人物以清晰的类型、功能或象征存在，不要求每个角色都必须像完整独立的心理个体。'}},
 caus:{neg:{en:'Orchestrated',zh:'编排型'},pos:{en:'Emergent',zh:'生长型'},negL:'O',posL:'E',label:{en:'Story motion',zh:'剧情动力'},
  posStmt:{en:'You {d} prefer consequences to grow from earlier choices and rules, rather than feeling visibly arranged around preplanned twists, climaxes or payoffs.',zh:'你{d}偏好结果从前面的选择和规则自然长出来，而不是明显为了既定反转、高潮或爆点去安排前因。'},
  negStmt:{en:'You {d} enjoy stories that are visibly engineered around twists, climaxes and satisfying payoffs, even when the larger design matters more than local cause-and-effect.',zh:'你{d}接受故事围绕反转、高潮和爽点进行明显编排，即使整体设计有时比局部因果更重要。'}},
 affect:{neg:{en:'Signaled',zh:'提示型'},pos:{en:'Embedded',zh:'内嵌型'},negL:'S',posL:'E',label:{en:'Emotional language',zh:'情绪表达'},
  posStmt:{en:'You {d} prefer emotion and theme to emerge from behavior, images, objects and rhythm, rather than being strongly announced by dialogue, music or reaction cues.',zh:'你{d}偏好让情绪和主题从行为、画面、物件和节奏里自己浮出来，而不是靠台词、配乐或反应镜头明确提示。'},

function degree(v){const a=Math.abs(v);if(state.lang==='zh'){if(a<15)return '大体不偏向任何一端，既能';if(a<35)return '略微';if(a<60)return '比较';if(a<80)return '明显';return '非常'}else{if(a<15)return 'are broadly balanced and can';if(a<35)return 'slightly';if(a<60)return 'moderately';if(a<80)return 'strongly';return 'very strongly'}}
function axisStatement(axis,v){if(Math.abs(v)<15){if(state.lang==='zh')return `${pct(v)}% 接近平衡。你会根据具体电影在“${L(axis.neg)}”与“${L(axis.pos)}”之间切换，没有明显固定偏向。`;return `${pct(v)}% from center. You switch between ${L(axis.neg)} and ${L(axis.pos)} depending on the film, with no strong fixed preference.`}const pole=v>=0?axis.pos:axis.neg;const tmpl=v>=0?axis.posStmt:axis.negStmt;const d=degree(v);return state.lang==='zh'?`${pct(v)}% 偏向${L(pole)}。`+L(tmpl).replace('{d}',d):`${pct(v)}% toward ${L(pole)}. `+L(tmpl).replace('{d}',d)}

const tasteTypes={
 AEEE:{en:['The Auteur Detective','You want characters to own their choices and filmmakers to own their style. Strong craft is welcome; visible emotional instructions are less necessary.'],zh:['作者型侦探','你希望人物对自己的选择负责，也希望导演有鲜明的手。形式可以很高调，但情绪最好别拿着说明书塞给你。']},

 AESE:{en:['The Emotional Auteur','You like vivid people and vivid filmmaking, and you do not mind the movie conducting the room when it has earned the baton.'],zh:['情绪作者派','你既要鲜活人物，也要鲜明电影语言；只要电影配得上指挥棒，你并不排斥它带着全场一起感受。']},
 AEST:{en:['The Classical Empath','Credible people, clear feeling, clean delivery. You like emotional architecture when it still feels human.'],zh:['古典共情派','人物可信、情绪清楚、表达利落。只要人还是人，你并不介意电影把情感结构搭得漂亮。']},
 AOEE:{en:['The Choreographed Rebel','You enjoy big design and visible style, but the characters still need private lives inside the machinery.'],zh:['编舞式叛逆者','你享受大设计和强形式，但机器再漂亮，里面的人也得保留自己的私生活。']},
 AOET:{en:['The Precision Dramatist','You appreciate a well-built dramatic machine, provided the human parts remain credible and the technique stays disciplined.'],zh:['精密戏剧师','你欣赏结构漂亮的戏剧机器，前提是人物还能站得住，手法也别喧宾夺主。']},
 AOSE:{en:['The Grand Characterist','You like actors, emotion and spectacle to arrive at full volume, but not at the cost of recognizable human behavior.'],zh:['盛大人物派','你欢迎表演、情绪和场面一起开大音量，但不能因此把人物本身弄丢。']},
 AOST:{en:['The Prestige Romantic','You like polished emotional architecture, clear character stakes and a movie that knows exactly when to land the big beat.'],zh:['精装浪漫派','你喜欢精心搭好的情感结构、清楚的人物目标，以及知道什么时候该把大招落下来的电影。']},
 REEE:{en:['The Mythic Experimentalist','You can let characters become icons, masks or story-shapes if the movie builds a strange world with its own living rules.'],zh:['神话实验派','人物可以是图腾、面具或类型轮廓，只要电影真的建立出一套会自己运转的奇异世界。']},
 REET:{en:['The Lean Fabulist','You like clean forms, simple figures and consequences that grow naturally. A fable can be enough.'],zh:['简洁寓言派','你喜欢干净的形式、清楚的人物轮廓，以及自然长出来的后果。一则好寓言就已经足够。']},
 RESE:{en:['The Pop Surrealist','You enjoy bold style, clear emotion and characters that can function like icons inside an energetic cinematic system.'],zh:['流行超现实派','你喜欢高调形式、清晰情绪，也接受人物像图标一样在充满能量的电影系统里运转。']},
 REST:{en:['The Clean Storyteller','You value readable roles, clear feeling and stories that move without making the machinery the main attraction.'],zh:['清爽故事派','你看重清楚的角色功能、明确的情感和顺畅推进；机器可以很精密，但不必成为主角。']},
 ROEE:{en:['The Designed Dreamer','You like movies that visibly invent their own rules, symbols and visual worlds—even when people serve the larger design.'],zh:['设计型造梦者','你喜欢电影公开发明自己的规则、符号和视觉世界；人物有时为整体设计服务也没关系。']},

 ROSE:{en:['The Grand Entertainer','Give you archetypes, spectacle, music and a satisfying payoff. Cinema is allowed to put on a show.'],zh:['盛大娱乐家','类型人物、场面、音乐、爽点都可以来。电影本来就有权认真办一场秀。']},
 ROST:{en:['The Popcorn Oracle','You understand the ancient contract: clean roles, deliberate setup, strong cues, satisfying delivery. Sometimes the obvious choice is obvious because it works.'],zh:['爆米花先知','你理解那份古老契约：角色清楚、铺垫明确、情绪到位、结尾兑现。有些招之所以老，是因为它真的好用。']}

 AEEC:{en:['The Big-Screen Binger','You love the event and the journey more than the postmortem. If a world hooks you, you happily stay inside it.'],zh:['大银幕追更派','你更爱现场和旅程，不急着尸检电影；一旦世界观把你勾住，你很愿意继续待在里面。']},
 AEES:{en:['The Night-Out Dreamer','You go for the experience, let the movie wash over you, and move on when the night is over.'],zh:['散场梦游者','你为体验本身而去，让电影先把你带走；夜晚结束以后，也可以轻轻放下。']},

function questionBank(kind,mode){const bank=kind==='taste'?tasteQuestions:watchQuestions;return bank.filter(q=>mode==='deep'||q.tier==='quick')}
function start(kind,mode='quick'){session={kind,mode,qs:questionBank(kind,mode),idx:0,answers:[],eggs:{}};renderQuestion()}
function startFlow(mode){flow={mode,step:0};start('taste',mode)}
function renderQuestion(){const q=session.qs[session.idx],isTaste=session.kind==='taste';state.last=session.kind;save();
 const color=isTaste?'var(--taste-a)':'var(--watch-a)';const progress=Math.round(session.idx/session.qs.length*100);
 $('#app').innerHTML=`<section class="page quiz-shell" style="--module-color:${color}">
   <div class="quiz-top"><div class="progress-track"><div class="progress-fill ${isTaste?'taste-progress':'watch-progress'}" style="width:${progress}%"></div></div><div class="count">${session.idx+1} / ${session.qs.length}</div></div>
   <div class="question-card">
    <div class="question-kind">${q.kind==='duel'?L(UI.quiz.duel):q.kind==='habit'?L(UI.quiz.habit):L(UI.quiz.scene)}</div>
    <h2>${esc(L(q.prompt))}</h2>${q.sub?`<p class="question-sub">${esc(L(q.sub))}</p>`:''}
    <div class="options">${q.opts.map((o,i)=>`<button class="option-btn" data-answer="${i}"><span class="option-label"><span class="option-key">${String.fromCharCode(65+i)}</span><span>${esc(L(o.text))}</span></span></button>`).join('')}</div>
   </div>
   <div class="quiz-bottom"><button class="link-btn" id="backQ" ${session.idx===0?'disabled':''}>← ${L(UI.quiz.back)}</button><button class="link-btn" id="skipQ">${L(UI.quiz.skip)} →</button></div>
 </section>`;
 $$('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer));$('#skipQ').onclick=()=>answer(null);$('#backQ').onclick=backAnswer;
 window.scrollTo({top:0,behavior:'smooth'});
}
function answer(i){session.answers[session.idx]=i;if(i!=null){const o=session.qs[session.idx].opts[i];for(const [k,v] of Object.entries(o.egg||{}))session.eggs[k]=(session.eggs[k]||0)+v}session.idx++;if(session.idx>=session.qs.length)finish();else renderQuestion()}
function backAnswer(){if(session.idx<=0)return;session.idx--;rebuildEggs();renderQuestion()}
function rebuildEggs(){session.eggs={};session.answers.forEach((a,idx)=>{if(a==null)return;const o=session.qs[idx]?.opts[a];if(!o)return;for(const [k,v] of Object.entries(o.egg||{}))session.eggs[k]=(session.eggs[k]||0)+v})}
function finish(){const axes=session.kind==='taste'?tasteAxes:watchAxes;const totals={},max={};Object.keys(axes).forEach(k=>{totals[k]=0;max[k]=0});
 session.qs.forEach((q,idx)=>{const a=session.answers[idx];if(a==null)return;const o=q.opts[a];for(const k of Object.keys(axes)){const v=o.w?.[k]||0;totals[k]+=v;max[k]+=Math.abs(v)}});
 const scores={};Object.keys(axes).forEach(k=>scores[k]=max[k]?Math.max(-100,Math.min(100,totals[k]/max[k]*100)):0);
 const code=Object.entries(axes).map(([k,a])=>scores[k]>=0?a.posL:a.negL).join('');const types=session.kind==='taste'?tasteTypes:watchTypes;const info=types[code]||{en:[code,'A mixed profile.'],zh:[code,'一份混合型画像。']};
 const result={kind:session.kind,mode:session.mode,scores,code,title:{en:info.en[0],zh:info.zh[0]},headline:{en:info.en[1],zh:info.zh[1]},eggs:session.eggs,answered:session.answers.filter(x=>x!=null).length};
 state[session.kind]=result;save();
 if(flow){if(flow.step===0){flow.step=1;start('watch',flow.mode);return}else flow=null}
 session=null;
 renderResults();
}

function makeShare(r){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext('2d'),h=hashHue(r.code,r.kind),h2=(h+55)%360;ctx.fillStyle='#0b0d12';ctx.fillRect(0,0,1080,1350);const g=ctx.createLinearGradient(0,0,1080,900);g.addColorStop(0,`hsla(${h},88%,60%,.30)`);g.addColorStop(.55,'rgba(11,13,18,0)');g.addColorStop(1,`hsla(${h2},88%,60%,.22)`);ctx.fillStyle=g;ctx.fillRect(0,0,1080,950);ctx.fillStyle=`hsl(${h} 90% 67%)`;ctx.font='900 30px system-ui';ctx.fillText(r.kind==='taste'?(state.lang==='zh'?'CINETYPE / 电影偏好':'CINETYPE / FILM DNA'):(state.lang==='zh'?'CINETYPE / 观影方式':'CINETYPE / WATCHING STYLE'),72,92);ctx.font='950 200px ui-monospace,monospace';ctx.fillText(r.code,62,315);ctx.fillStyle='#f7f3eb';ctx.font='900 60px system-ui';wrapText(ctx,L(r.title),72,430,900,70);ctx.fillStyle='#b8bac2';ctx.font='400 29px system-ui';wrapText(ctx,L(r.headline),72,570,900,43);const axes=r.kind==='taste'?tasteAxes:watchAxes;let y=780;for(const [k,a] of Object.entries(axes)){ctx.fillStyle='#f7f3eb';ctx.font='700 23px system-ui';ctx.textAlign='left';ctx.fillText(L(a.neg),72,y);ctx.textAlign='right';ctx.fillText(L(a.pos),1008,y);ctx.fillStyle='rgba(255,255,255,.13)';ctx.fillRect(72,y+18,936,10);const px=72+((r.scores[k]+100)/200)*936;ctx.fillStyle=`hsl(${h} 90% 67%)`;ctx.beginPath();ctx.arc(px,y+23,13,0,Math.PI*2);ctx.fill();y+=90}ctx.textAlign='left';ctx.fillStyle='#777d88';ctx.font='500 21px system-ui';ctx.fillText(state.lang==='zh'?'连续分数 > 四字母标签。':'Continuous scores > four-letter label.',72,1240);ctx.fillStyle=`hsl(${h2} 90% 70%)`;ctx.font='800 24px system-ui';ctx.fillText('CineType v2',72,1302);canvas.toBlob(async blob=>{if(!blob)return;const file=new File([blob],'cinetype-v2-result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:`CineType ${r.code}`});return}catch{}}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cinetype-v2-result.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(state.lang==='zh'?'分享卡已保存':'Share card saved')},'image/png')}

function renderGrill(){state.last='grill';save();$('#app').innerHTML=`<section class="page"><div class="page-head"><div class="eyebrow">${L(UI.grill.eye)}</div><h1>${L(UI.grill.title)}</h1><p>${L(UI.grill.copy)}</p></div><div class="grill-grid"><section class="panel"><div class="section-title-row"><h2>${L(UI.grill.source)}</h2><span class="palette-tag">${L(UI.grill.local)}</span></div><div class="source-tabs" id="sourceTabs"><button class="active" data-source="letterboxd">Letterboxd</button><button data-source="imdb">IMDb</button><button data-source="douban">豆瓣</button><button data-source="paste">${state.lang==='zh'?'粘贴文本':'Paste text'}</button></div><div class="connector" id="connector"></div><label class="filebox">${L(UI.grill.upload)}<br><span class="micro">${L(UI.grill.uploadSub)}</span><input id="fileInput" type="file" accept=".csv,.txt,text/csv,text/plain"></label><button class="secondary full" id="demoBtn">${L(UI.grill.demo)}</button></section><section class="panel"><div class="section-title-row"><h2>${state.lang==='zh'?'本地画像器':'Local profiler'}</h2><span class="micro" id="importStatus">${L(UI.grill.waiting)}</span></div><div id="importPreview" class="grill-copy">${state.lang==='zh'?'导入文件或载入匿名演示。原型会读取评分分布、文字密度和简单矛盾信号，再与测试结果并排比较。':'Import a file or load the anonymous demo. The prototype reads rating spread, review density and simple contradiction signals, then compares them with your quiz profile.'}</div><button class="primary full" id="grillBtn" disabled>${L(UI.grill.grillBtn)}</button><div id="grillOut" class="grill-copy" style="margin-top:18px"></div></section></div></section>`;
 let src='letterboxd';function conn(){const c=$('#connector');const text={letterboxd:{en:'Use a Letterboxd account export CSV/ZIP in the production build. Live profile connection remains a server-side placeholder here.',zh:'正式版本建议优先读取 Letterboxd 账号导出的 CSV / ZIP；这个原型里的账号直连仍然只是服务器端占位。'},imdb:{en:'IMDb rating-history CSV works best for a local prototype. Live API connection remains a placeholder.',zh:'本地原型最适合读取 IMDb 评分历史 CSV；实时 API 直连仍然是占位功能。'},douban:{en:'Douban profile crawling is unreliable from a standalone browser app. Keep the URL connector as a backend placeholder and support user exports/paste.',zh:'单文件网页直接抓取豆瓣主页并不稳定。保留网址入口作为后端占位，同时支持用户导出或粘贴记录更实际。'},paste:{en:'Paste one film per line: Title | rating | short review.',zh:'每行一部：片名 | 评分 | 短评。'}};c.innerHTML=`${L(text[src])}${src==='paste'?`<textarea id="pasteBox" placeholder="Moonlight | 5 | quiet but devastating\nTitanic | 4.5 | ..."></textarea><button class="ghost small" id="pasteGo" style="margin-top:10px">${state.lang==='zh'?'读取文本':'Read text'}</button>`:`<input placeholder="${state.lang==='zh'?'账号网址（原型占位）':'Profile URL (placeholder)'}"><button class="ghost small" style="margin-top:10px" id="placeholderBtn">${state.lang==='zh'?'测试连接':'Test connector'}</button>`}`;if($('#placeholderBtn'))$('#placeholderBtn').onclick=()=>toast(state.lang==='zh'?'此版本请使用文件导入':'Use file import in this build');if($('#pasteGo'))$('#pasteGo').onclick=()=>{const t=$('#pasteBox').value.trim();if(!t)return;state.imported={source:'paste',entries:parsePaste(t)};save();importPreview()}}
 conn();$$('#sourceTabs button').forEach(b=>b.onclick=()=>{$$('#sourceTabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');src=b.dataset.source;conn()});$('#demoBtn').onclick=()=>{state.imported={source:'anonymous demo',entries:demoDiary};save();importPreview()};$('#fileInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const t=await f.text();state.imported={source:f.name,entries:f.name.toLowerCase().endsWith('.csv')?parseCSV(t):parsePaste(t)};save();importPreview()};$('#grillBtn').onclick=grill;if(state.imported)importPreview()}
function parseCSV(text){const rows=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);if(!rows.length)return[];const parseLine=s=>{const out=[];let cur='',q=false;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==='"'){if(q&&s[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out};const h=parseLine(rows[0]).map(x=>x.trim().toLowerCase());const ti=h.findIndex(x=>/title|name|电影|片名/.test(x)),ri=h.findIndex(x=>/rating|score|评分/.test(x)),ci=h.findIndex(x=>/review|comment|notes|短评|评论/.test(x));return rows.slice(1).map(r=>{const c=parseLine(r);return{title:c[ti>=0?ti:0]||'Untitled',rating:+(c[ri]||0)||null,review:c[ci]||''}}).filter(x=>x.title)}
function parsePaste(text){return text.split(/\r?\n/).filter(Boolean).map(line=>{const p=line.split('|').map(x=>x.trim());return{title:p[0]||'Untitled',rating:+p[1]||null,review:p.slice(2).join(' | ')}})}
function importPreview(){const e=state.imported?.entries||[],ratings=e.map(x=>x.rating).filter(Number.isFinite),avg=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(2):'—',reviewed=e.filter(x=>x.review?.trim()).length;$('#importStatus').textContent=`${e.length} ${state.lang==='zh'?'条记录':'entries'}`;$('#importPreview').innerHTML=`<div class="import-summary"><div class="stat"><b>${e.length}</b><span class="micro">${state.lang==='zh'?'电影':'films'}</span></div><div class="stat"><b>${avg}</b><span class="micro">${state.lang==='zh'?'平均评分':'avg rating'}</span></div><div class="stat"><b>${reviewed}</b><span class="micro">${state.lang==='zh'?'含短评':'with notes'}</span></div></div><p>${state.lang==='zh'?'当前版本只做轻量本地分析；正式版应把结构化证据交给生成式模型写“拷问”，而不是直接把整份日记塞进去。':'This build performs lightweight local analysis. A production version should pass structured evidence to the generative grill rather than dump the whole diary into a model.'}</p>`;$('#grillBtn').disabled=!e.length}
function grill(){const e=state.imported?.entries||[],txt=e.map(x=>x.review||'').join(' ').toLowerCase(),ratings=e.map(x=>x.rating).filter(Number.isFinite),hi=e.filter(x=>x.rating>=4&&(x.review||'').length>70).length;const sentences=[];if(state.taste)sentences.push(state.lang==='zh'?`你的自报电影偏好是 ${state.taste.code}（${L(state.taste.title)}）。导入记录不会自动证明它正确，只能找矛盾。`:`Your declared Film DNA is ${state.taste.code} (${L(state.taste.title)}). The diary does not prove it; it gives us places to look for contradictions.`);if(hi)sentences.push(state.lang==='zh'?`你有 ${hi} 条高分记录同时写了很长的批评。也就是说，“喜欢”与“没意见”在你的数据里显然不是一回事。`:`${hi} high-rated entries still contain substantial criticism. In this diary, “liked it” clearly does not mean “had no objections.”`);if(/score|music|配乐|音乐/.test(txt))sentences.push(state.lang==='zh'?'你反复注意音乐或声音；正式版应该把“情绪提示”与“纯粹声音审美”分开，否则会把两个不同偏好混为一谈。':'Music/sound recurs in the notes. A production model should separate emotional cueing from pure sonic pleasure rather than treat them as one preference.');if(/character|角色|人物|motivation|动机/.test(txt))sentences.push(state.lang==='zh'?'人物相关词出现得很频繁。下一版可以用实际评论来检验“主体型”分数究竟是稳定口味，还是只是你在不喜欢电影时更爱抓人物逻辑。':'Character language appears repeatedly. A stronger model could test whether your Agentic score is a stable taste or simply the vocabulary you use most when a movie has already lost you.');if(!sentences.length)sentences.push(state.lang==='zh'?'这份样本目前太轻，最诚实的结论是：需要更多有评分、也有文字的记录，才能对测试结果进行真正反驳。':'The honest result is that this sample is too light. We need more entries with both ratings and text before the diary can meaningfully challenge the quiz.');$('#grillOut').innerHTML=sentences.map(s=>`<p>${esc(s)}</p>`).join('')}

function bindNav(){$$('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav))}
function navigate(n){if(n==='taste')return start('taste','quick');if(n==='watch')return start('watch','quick');session=null;flow=null;if(n==='home')home();else if(n==='grill')renderGrill();else if(n==='results')renderResults()}
function renderNav(){const n=$('#topnav');n.innerHTML=Object.keys(UI.nav).map(k=>`<button data-nav="${k}">${L(UI.nav[k])}</button>`).join('');bindNav()}
function rerender(){applyTheme();renderNav();if(session)renderQuestion();else navigate(state.last||'home')}
$('#langBtn').onclick=()=>{state.lang=state.lang==='en'?'zh':'en';save();rerender()};$('#themeBtn').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';save();rerender()};
applyTheme();renderNav();navigate(state.last||'home');
})();
</script>
